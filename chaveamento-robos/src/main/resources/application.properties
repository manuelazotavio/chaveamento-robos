server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:chaveamentoRobos}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:aluno}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# padrao do Spring e 1MB por arquivo, mas um WAV nao-comprimido de ate 10s de audio
# de vitoria (times.tsx) facilmente passa disso
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:euSouLinda123}

app.cors.origem-frontend=${FRONTEND_URL:http://localhost:5173}
