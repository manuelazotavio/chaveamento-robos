server.port=${PORT:8080}


# prepareThreshold=0 desabilita prepared statements nomeados no lado do servidor: obrigatorio
# ao usar o pooler do Supabase (Supavisor) em modo transaction, que reaproveita a mesma conexao
# fisica entre transacoes de clientes diferentes -- sem isso da erro intermitente
# "prepared statement already exists" (nome colide com o de outra transacao na mesma conexao)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:chaveamentoRobos}?sslmode=${PGSSLMODE:disable}&prepareThreshold=0
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:aluno}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:8435b0af1f151997e98a5bd8ff75a56e7b1461acd449398b782eff0b1d10be5}

app.cors.origem-frontend=${FRONTEND_URL:http://localhost:5173}


supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:times}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect